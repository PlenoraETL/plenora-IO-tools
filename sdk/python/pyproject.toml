[build-system]
# `>=64` e non `>=68`: sessantaquattro e' la prima versione che regge un
# progetto dichiarato interamente in `pyproject.toml`, ed e' quella che gli
# ambienti di verifica hanno. Chiedere di piu' avrebbe costretto a scaricare
# setuptools per costruire dalla sdist, cioe' a introdurre una rete dove questo
# pacchetto promette di non averne bisogno.
#
# `wheel` c'e' perche' **serve davvero**: fino alla 70, setuptools delega a lui
# il comando `bdist_wheel`, e senza, l'installazione dalla sdist fallisce con
# «invalid command». Dichiararlo e' cio' che permette a un ambiente isolato di
# procurarselo; l'abbiamo scoperto costruendo dalla sdist in un venv pulito, che
# e' l'unico posto dove la differenza si vede.
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plenora-io"
description = "Wrapper Python puro sopra la CLI plenora-io e il suo protocollo v2"
readme = "README.md"

# Le versioni **provate**, e nient'altro.
#
# Il limite superiore non e' pessimismo: `Requires-Python` e' cio' che pip legge
# per decidere se questo pacchetto puo' girare, e dichiarare `>=3.10` senza
# limite prometterebbe ogni Python futuro. La matrice della CI prova dalla 3.10
# alla 3.14; il giorno in cui ne provera' un'altra, questa riga si allarga
# insieme a lei.
#
# Il minimo e' 3.10 perche' PYTHON-SDK-1.0 §2 lo pretende («MUST support Python
# 3.10 or newer») ed e' quello delle altre librerie Plenora: un ambiente che le
# usa insieme ha una sola intersezione, e la 3.11 di prima la restringeva per
# tutti. Il codice non usa niente che 3.10 non abbia -- `kw_only` delle
# dataclass e `types.UnionType` sono della 3.10 -- e la matrice lo prova.
requires-python = ">=3.10,<3.15"

# Nessuna dipendenza, ed e' una scelta.
#
# Un SDK che si appoggia a una CLI ha bisogno di `subprocess`, `json` e
# `pathlib`, che stanno nella libreria standard. Ogni dipendenza in piu' sarebbe
# una superficie che chi installa questo pacchetto deve fidarsi, per un lavoro
# che il linguaggio fa gia'.
dependencies = []

# La versione ha **una sola** sorgente autorevole: `plenora_io.__version__`.
# Scritta anche qui, le due sarebbero divergute alla prima release fatta di
# fretta, e il pacchetto avrebbe dichiarato una versione e importato un'altra.
dynamic = ["version"]

classifiers = [
    # Il pacchetto non va su PyPI, e lo dice a chi provasse a caricarlo: i
    # servizi di indice rifiutano questo classificatore. E' la stessa
    # affermazione che i crate Rust di questo repository fanno con
    # `publish = false`.
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

# La licenza e' quella del repository, `LICENSE` alla radice: proprietaria,
# «Copyright (c) Plenora ETL. All rights reserved.», la stessa di
# plenora-database-tools. Prima questo campo mancava di proposito, perche' il
# titolare non aveva ancora fornito termini first-party; ora li ha forniti, e
# il campo li dichiara invece di lasciarli dedurre. Il pacchetto resta fuori da
# ogni indice pubblico -- il classificatore qui sopra -- e
# `scripts/check_canale_privato.py` verifica che il canale resti chiuso.
license = { text = "Proprietary" }

# L'adattatore Arrow, **facoltativo**: `Client.read_table()` e `Client.write()`
# da un oggetto Arrow (`plenora_io/arrow.py`). Chi lavora per percorsi non lo
# installa e non lo paga.
#
# La serie e' `>=25,<26`, la stessa che plenora-data-tools dichiara come
# dipendenza: due librerie Plenora nello stesso ambiente devono poter stare
# sulla stessa pyarrow, e una serie diversa qui renderebbe impossibile
# installarle insieme. Un intervallo e non un pin esatto perche' e' un vincolo
# di **installazione** per chi usa il pacchetto; il pin esatto, `25.0.1`, e'
# quello con cui la CI prova (`.github/workflows/ci.yml`). Un'altra serie si
# dichiara dopo averla provata, non prima, e `arrow.py` la rifiuta anche se
# installata a mano accanto al vincolo.
[project.optional-dependencies]
pyarrow = ["pyarrow>=25,<26"]

[project.urls]
Repository = "https://github.com/PlenoraETL/plenora-IO-tools"

[tool.setuptools.dynamic]
version = { attr = "plenora_io.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `py.typed` dice a un type checker che le annotazioni di questo pacchetto sono
# da credere. Senza, mypy e pyright le ignorano e chi installa perde i tipi che
# l'SDK esiste anche per dare.
plenora_io = ["py.typed"]

[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor/dxf", "vendor/gdal"]

[workspace.package]
version = "1.0.1"
edition = "2021"
rust-version = "1.92"
publish = false

# Pin comune con plenora-data-tools (ADR/D0): i RecordBatch passano fra le due
# librerie senza conversione solo se la versione Arrow coincide.
[workspace.dependencies]
arrow-array = "=59.1.0"
arrow-schema = "=59.1.0"
arrow-ipc = "=59.1.0"
arrow-select = "=59.1.0"
arrow-buffer = "=59.1.0"
parquet = { version = "=59.1.0", default-features = false, features = ["arrow", "snap", "brotli", "flate2-rust_backend", "lz4", "zstd"] }
geo-types = "=0.7.19"
geojson = { version = "=0.24.2", features = ["geo-types"] }
csv = "=1.4.0"
wkt = "=0.14.0"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
shapefile = { version = "=0.6.0", features = ["geo-types"] }
kml = { version = "=0.14.0", features = ["geo-types"] }
quick-xml = "=0.41.0"
calamine = "=0.36.1"
rust_xlsxwriter = "=0.79.4"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
dxf = "=0.6.1"
gdal = "=0.17.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# Validazione JSON-Schema draft-07 per i metadati GeoParquet.
# `default-features = false` toglie i resolver HTTP e filesystem: i `$ref`
# si risolvono **solo** da un registro in memoria costruito sugli schemi
# fissati in `assurance/schemi/`. Uno schema che si scarica quando serve
# non e' fissato: e' sperato.
jsonschema = { version = "=0.51.0", default-features = false }
base64 = "=0.22.1"
tempfile = "=3.27.0"
# L'unico modo di collegare Ctrl+C al `CancellationToken` senza `unsafe`, che
# il workspace **vieta** (`unsafe_code = "forbid"`, non `deny`: nemmeno un
# `#[allow]` mirato lo riaprirebbe). Installare un gestore di segnale richiede
# `libc::signal` o l'equivalente Windows, cioe' codice unsafe che qui non puo'
# esistere; `ctrlc` lo incapsula e copre entrambe le piattaforme -- `SIGINT` su
# Unix, `SetConsoleCtrlHandler` su Windows -- dietro una sola API sicura.
#
# Conta anche **come** lo fa: il gestore del sistema si limita a svegliare un
# thread dedicato, che poi chiama la nostra chiusura. E' cio' che rende lecito
# prendere un lock nel gestore, dove un handler vero ammetterebbe solo funzioni
# async-signal-safe.
ctrlc = "=3.5.0"
libc = "=0.2.189"
rustix = { version = "=1.1.4", features = ["fs"] }
atomicwrites = "=0.4.4"

[workspace.lints.rust]
unsafe_code = "forbid"

# Politica lint allineata a plenora-data-tools e plenora-database-tools: la
# tabella dichiara nel manifest cio' che la CI applica gia' via riga di
# comando, cosi' la policy resta verificabile anche fuori dalla CI. Ogni
# deviazione voluta resta possibile solo come `#[allow]` mirato e motivato nel
# codice. Il gate anti-panic sulle librerie resta un passo CI dedicato con lint
# espliciti (piu' stretto di questa tabella).
[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
# Il default di Rust attiva i controlli di overflow in debug e li disattiva in
# release: un'aritmetica che va oltre il tipo, in produzione, avvolge in
# silenzio. Per un componente che legge file esterni non fidati e dichiara
# semantica fail-closed e' il verso sbagliato — un offset o un conteggio di
# vertici avvolto e' plausibile, falso, e prosegue senza che alcun gate lo
# veda.
#
# Con questa riga l'overflow diventa un panico dichiarato anche in release, e
# quindi un fallimento visibile invece di un dato corrotto. Il gate anti-panic
# sulle librerie resta coerente: vieta le primitive di panico *scritte*, non i
# controlli del compilatore su un'invariante violata.
#
# Costo misurato su plenora-database-tools con i microbenchmark offline:
# mediana +0,4%, peggiore +4,7%.
overflow-checks = true

[patch.crates-io]
# Fork governato della sorgente crates.io gdal 0.17.1. Il delta espone
# OGR_L_SetIgnoredFields dietro un metodo safe; provenienza e manutenzione sono
# registrate in assurance/registries/vendor-gdal-fork.json.
gdal = { path = "vendor/gdal" }
# Fork governato della sorgente upstream dxf 0.6.1. Il delta evita il
# read-to-end e rende pubblico un reader fallibile di entità logiche;
# provenienza e manutenzione sono registrate in
# assurance/registries/vendor-dxf-fork.json.
dxf = { path = "vendor/dxf" }

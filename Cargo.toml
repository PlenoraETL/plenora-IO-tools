[workspace]
resolver = "2"
members = ["crates/*"]
# `upstream/` porta i casi minimi da mandare a monte: devono compilare per chi
# non ha questo repository, quindi non sono membri del workspace.
exclude = ["vendor/dxf", "vendor/gdal", "vendor/parquet", "vendor/shapefile", "upstream/arrow-rs-byte-stream-split", "upstream/parquet-footer-thrift-list"]

[workspace.package]
version = "4.1.1"
edition = "2021"
rust-version = "1.98.1"
publish = false
# I crate sono proprietari e non pubblicati: `license-file` e' il campo Cargo
# previsto quando non c'e' un identificatore SPDX applicabile, come in
# plenora-database-tools. I manifesti dei crate lo ereditano.
license-file = "LICENSE"

# Arrow 60.0.0, la stessa versione esatta di plenora-data-tools 2.x e di
# plenora-database-tools 7.x. Un `RecordBatch` di arrow 59 e uno di arrow 60
# sono tipi diversi: con la stessa versione i tre componenti possono scambiarsi
# batch in memoria nella stessa compilazione, e il conflitto, se una delle tre
# cambiasse da sola, sarebbe un errore di risoluzione e non una conversione.
# Il pin precedente (59.3.0) era motivato come «comune con data-tools», che nel
# frattempo e' passato a 60.
[workspace.dependencies]
arrow-array = "=60.0.0"
arrow-schema = "=60.0.0"
arrow-ipc = "=60.0.0"
arrow-select = "=60.0.0"
arrow-buffer = "=60.0.0"
# `parquet` 60.0.0 con le correzioni del fork `-eof` di plenora-data-tools,
# vendorizzato in `vendor/parquet` con lo stesso albero (byte per byte, salvo il
# nome del pacchetto) e come dipendenza diretta con nome proprio, per la stessa
# ragione dei tre fork qui sotto: una `[patch]` non arriverebbe a chi dipende
# da noi.
#
# Perche' il fork e non la 60.0.0 di crates.io: la 60.0.0 limita ai byte
# residui gli elenchi letti con `read_thrift_vec` (il caso della 4.1.1,
# `key_value_metadata`, 3966 byte che prenotavano 2,3 GB), ma non i row group
# del footer, che prenota ancora dal conteggio dichiarato; ne' le posizioni
# dell'offset index; e il protocollo Thrift su `Read` gira a vuoto sugli header
# di pagina malformati. Il fork chiude quei casi (registro:
# `assurance/registries/vendor-parquet-fork.json`). Le feature sono l'unione di
# quelle di data-tools e delle nostre: brotli, flate2 e lz4 in piu'.
parquet = { package = "plenora-fork-parquet", version = "=60.0.0", path = "vendor/parquet", default-features = false, features = ["arrow", "snap", "brotli", "flate2-rust_backend", "lz4", "zstd"] }
geo-types = "=0.7.20"
geojson = { version = "=1.0.0", features = ["geo-types"] }
csv = "=1.4.0"
wkt = "=0.14.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# I tre fork governati (`shapefile`, `dxf`, `gdal`) sono dipendenze **dirette**
# per percorso, con un nome di pacchetto proprio, e non piu' `[patch.crates-io]`.
#
# Perche': Cargo applica `[patch]` solo dal workspace radice. Chi usa questi
# crate come dipendenza (git o percorso) non eredita le patch, e il nome
# `shapefile` / `dxf` / `gdal` gli arriva da crates.io, cioe' **senza i
# delta**. Oggi la compilazione fallisce perche' i driver chiamano API che solo
# i fork espongono, ma e' una difesa accidentale: un delta solo di
# comportamento -- come la correzione del ciclo infinito di `dxf` della 4.1.1 --
# passerebbe in silenzio il giorno in cui l'API coincidesse.
#
# Con la dipendenza per percorso il fork viaggia con il crate che lo usa, e il
# nome proprio (`plenora-fork-*`) impedisce che una versione di crates.io lo
# sostituisca: quel nome su un registro non esiste. Il nome della libreria resta
# quello upstream (`[lib] name` nei manifesti dei fork), quindi il codice e i
# simboli non cambiano. La prova e' il consumatore esterno senza `[patch]` di
# `scripts/check_superficie_rust.py`; `scripts/fork_comune.py` vieta che una
# sezione `[patch]` ricompaia. Provenienza e delta: i registri
# `assurance/registries/vendor-*-fork.json`.
shapefile = { package = "plenora-fork-shapefile", version = "=0.9.0", path = "vendor/shapefile", features = ["geo-types"] }
kml = { version = "=0.14.0", default-features = false, features = ["geo-types"] }
quick-xml = { version = "=0.42.0", features = ["encoding"] }
calamine = "=0.36.1"
rust_xlsxwriter = "=0.99.1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
dxf = { package = "plenora-fork-dxf", version = "=0.6.1", path = "vendor/dxf" }
gdal = { package = "plenora-fork-gdal", version = "=0.19.0", path = "vendor/gdal" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# Validazione JSON-Schema draft-07 per i metadati GeoParquet.
# `default-features = false` toglie i resolver HTTP e filesystem: i `$ref`
# si risolvono **solo** da un registro in memoria costruito sugli schemi
# fissati in `assurance/schemi/`. Uno schema che si scarica quando serve
# non e' fissato: e' sperato.
jsonschema = { version = "=0.56.0", default-features = false }
base64 = "=0.23.1"
tempfile = "=3.27.0"
# L'unico modo di collegare Ctrl+C al `CancellationToken` senza `unsafe` nel
# nostro codice. `[workspace.lints.rust]` qui sotto mette `unsafe_code =
# "forbid"`, non `deny`, e vale per ogni crate che dichiara `[lints]
# workspace = true`: li' nemmeno un `#[allow]` mirato lo riaprirebbe. Non vale
# da solo per tutto cio' che sta sotto `crates/`: una tabella `[lints]` va
# ereditata, e `plenora-bench` -- strumento di misura, non spedito -- ne
# dichiara una propria con `unsafe_code = "allow"`, motivata nel suo
# `Cargo.toml`. Non vale nemmeno per le dipendenze, `ctrlc` compresa: il lint
# governa il codice che scriviamo, non quello che compiliamo. Installare un
# gestore di segnale richiede `libc::signal` o l'equivalente Windows, cioe'
# codice unsafe che nei crate di prodotto non puo' esistere; `ctrlc` lo
# incapsula e copre entrambe le piattaforme -- `SIGINT` su Unix,
# `SetConsoleCtrlHandler` su Windows -- dietro una sola API sicura.
#
# Conta anche **come** lo fa: il gestore del sistema si limita a svegliare un
# thread dedicato, che poi chiama la nostra chiusura. E' cio' che rende lecito
# prendere un lock nel gestore, dove un handler vero ammetterebbe solo funzioni
# async-signal-safe.
ctrlc = "=3.5.2"
libc = "=0.2.189"
rustix = { version = "=1.1.4", features = ["fs"] }
atomicwrites = "=0.4.4"

[workspace.lints.rust]
unsafe_code = "forbid"

# Politica lint allineata a plenora-data-tools e plenora-database-tools: la
# tabella dichiara nel manifest cio' che la CI applica gia' via riga di
# comando, cosi' la policy resta verificabile anche fuori dalla CI. Nei crate
# che la ereditano, ogni deviazione voluta resta possibile solo come `#[allow]`
# mirato e motivato nel codice; `plenora-bench` non la eredita e ripete la
# parte clippy nella propria tabella. Il gate anti-panic sulle librerie resta un passo CI dedicato con lint
# espliciti (piu' stretto di questa tabella).
[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
# Il default di Rust attiva i controlli di overflow in debug e li disattiva in
# release: un'aritmetica che va oltre il tipo, in produzione, avvolge in
# silenzio. Per un componente che legge file esterni non fidati e dichiara
# semantica fail-closed e' il verso sbagliato — un offset o un conteggio di
# vertici avvolto e' plausibile, falso, e prosegue senza che alcun gate lo
# veda.
#
# Con questa riga l'overflow diventa un panico dichiarato anche in release, e
# quindi un fallimento visibile invece di un dato corrotto. Il gate anti-panic
# sulle librerie resta coerente: vieta le primitive di panico *scritte*, non i
# controlli del compilatore su un'invariante violata.
#
# Costo misurato su plenora-database-tools con i microbenchmark offline:
# mediana +0,4%, peggiore +4,7%.
overflow-checks = true


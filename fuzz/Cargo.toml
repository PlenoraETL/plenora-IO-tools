# Progetto cargo-fuzz (coverage-guided, libFuzzer). Workspace DETACHED dal
# parent ([workspace] vuoto) così il gate stabile `cargo build --workspace` non
# tenta di compilarlo (richiede nightly + sanitizer). I path-dep risolvono i
# loro `.workspace = true` contro il parent (trovato risalendo le dir).
[package]
name = "plenora-cargofuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
plenora-io-model = { path = "../crates/plenora-io-model" }
driver-common = { path = "../crates/driver-common" }
driver-dxf = { path = "../crates/driver-dxf" }
driver-geojson = { path = "../crates/driver-geojson" }
driver-geoparquet = { path = "../crates/driver-geoparquet" }
driver-kml = { path = "../crates/driver-kml" }
driver-shp = { path = "../crates/driver-shp" }
geo-types = "=0.7.19"

[patch.crates-io]
# Il workspace fuzz è intenzionalmente detached e non eredita le patch del
# workspace principale. Usa quindi lo stesso fork governato del driver DXF.
dxf = { path = "../vendor/dxf" }

[[bin]]
name = "from_wkb"
path = "fuzz_targets/from_wkb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "geojson_reader"
path = "fuzz_targets/geojson_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wkt_parse"
path = "fuzz_targets/wkt_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kml_reader"
path = "fuzz_targets/kml_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shp_wkb"
path = "fuzz_targets/shp_wkb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dxf_reader"
path = "fuzz_targets/dxf_reader.rs"
test = false
doc = false
bench = false

# Ottimizzato ma con overflow-check attivi: un overflow diventa un crash
# (finding) invece di un wrap silenzioso.
[profile.release]
debug = 1
overflow-checks = true

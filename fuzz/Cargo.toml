# Progetto cargo-fuzz (coverage-guided, libFuzzer). Workspace DETACHED dal
# parent ([workspace] vuoto) così il gate stabile `cargo build --workspace` non
# tenta di compilarlo (richiede nightly + sanitizer). I path-dep risolvono i
# loro `.workspace = true` contro il parent (trovato risalendo le dir).
[package]
name = "plenora-cargofuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
plenora-io-model = { path = "../crates/plenora-io-model" }
plenora-io-core = { path = "../crates/plenora-io-core" }
driver-common = { path = "../crates/driver-common" }
driver-csv = { path = "../crates/driver-csv" }
driver-dxf = { path = "../crates/driver-dxf" }
driver-filegdb = { path = "../crates/driver-filegdb", features = ["gdal-backend"] }
driver-geojson = { path = "../crates/driver-geojson" }
driver-geoparquet = { path = "../crates/driver-geoparquet" }
driver-gpkg = { path = "../crates/driver-gpkg" }
driver-ipc = { path = "../crates/driver-ipc" }
driver-kml = { path = "../crates/driver-kml" }
driver-shp = { path = "../crates/driver-shp" }
driver-xls = { path = "../crates/driver-xls" }
geo-types = "=0.7.19"
# I driver di file leggono da `Source::Path`: l'input del fuzzer va
# materializzato in un file temporaneo prima di raggiungerli.
tempfile = "=3.27.0"

[patch.crates-io]
# Il workspace fuzz è intenzionalmente detached e non eredita le patch del
# workspace principale: ogni fork governato va ripetuto qui. Un fork che
# mancasse in questo elenco non darebbe un errore di risoluzione ma un target
# costruito su **un altro codice** — e la profondità misurata sarebbe quella di
# un binario che non spediamo.
dxf = { path = "../vendor/dxf" }
gdal = { path = "../vendor/gdal" }
shapefile = { path = "../vendor/shapefile" }

[[bin]]
name = "from_wkb"
path = "fuzz_targets/from_wkb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "geojson_reader"
path = "fuzz_targets/geojson_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wkt_parse"
path = "fuzz_targets/wkt_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kml_reader"
path = "fuzz_targets/kml_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shp_wkb"
path = "fuzz_targets/shp_wkb.rs"
test = false
doc = false
bench = false

# Il reader Shapefile **reale**: `shp_wkb` converte fra WKB e forme ESRI in
# memoria e non apre un file, non legge un header e non interpreta una tabella
# DBF. Sono due superfici diverse, e presentare la prima come copertura della
# seconda e' l'affermazione che `fuzz.reader-shapefile` esisteva per rifiutare.
[[bin]]
name = "shp_reader"
path = "fuzz_targets/shp_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dxf_reader"
path = "fuzz_targets/dxf_reader.rs"
test = false
doc = false
bench = false

# Superfici di file esterni non fidati coperte dalla seconda ondata: i formati
# contenitore (GeoPackage/SQLite, Parquet, XLSX/ZIP, Arrow IPC) e i tabellari,
# più il blob geometria GeoPackage che il driver interpreta byte per byte.
# Condividono `fuzz_targets/harness.rs` (materializzazione su file + drenaggio).

[[bin]]
name = "gpkg_geometry"
path = "fuzz_targets/gpkg_geometry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gpkg_reader"
path = "fuzz_targets/gpkg_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "geoparquet_reader"
path = "fuzz_targets/geoparquet_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipc_reader"
path = "fuzz_targets/ipc_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "csv_reader"
path = "fuzz_targets/csv_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xlsx_reader"
path = "fuzz_targets/xlsx_reader.rs"
test = false
doc = false
bench = false

# Percorso di scrittura: l'unico raggiungibile offline con un contratto
# interamente controllato dall'input (Arrow IPC è pass-through).
[[bin]]
name = "ipc_to_gpkg"
path = "fuzz_targets/ipc_to_gpkg.rs"
test = false
doc = false
bench = false

# Ottimizzato ma con overflow-check attivi: un overflow diventa un crash
# (finding) invece di un wrap silenzioso.
[profile.release]
debug = 1
overflow-checks = true

# Il percorso FileGDB, che passa da GDAL. `libgdal.so` e' di sistema e non e'
# strumentata: il fuzzer e' cieco dentro di essa, e il perimetro di cio' che
# AddressSanitizer vede e' misurato in assurance/registries/asan-filegdb.json.
[[bin]]
name = "filegdb_reader"
path = "fuzz_targets/filegdb_reader.rs"
test = false
doc = false
bench = false

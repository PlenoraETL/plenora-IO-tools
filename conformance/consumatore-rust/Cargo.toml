# Il consumatore esterno della superficie Rust pubblica.
#
# Non e' un membro del workspace, e non e' una svista: un crate dentro
# `crates/` sarebbe compilato insieme al resto, vedrebbe i `pub(crate)` ed
# erediterebbe i lint del workspace. Proverebbe che l'API e' raggiungibile da
# dentro, che e' precisamente cio' che non serve provare.
#
# La dipendenza e' per **percorso**, e il percorso viene riscritto da
# `scripts/check_superficie_rust.py`, che estrae l'archivio sorgente
# distribuito in una directory temporanea e mette questo crate accanto. Il
# valore qui sotto e' quello che serve per aprire il file in un editore; la
# compilazione usa quello dell'archivio.
[package]
name = "consumatore-rust"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
plenora-io-tools = { path = "../../crates/plenora-io-tools" }

# Niente `[patch]`, ed e' il punto. Fino alla 4.1.1 questo manifesto ripeteva
# le tre patch dei fork governati (`gdal`, `shapefile`, `dxf`): il workspace le
# applicava a se stesso, e Cargo non le propaga a chi lo usa come dipendenza.
# Un consumatore che non le avesse copiate avrebbe ricevuto i crate di
# crates.io, senza i delta -- oggi con un errore di compilazione, perche' i
# driver chiamano API che solo i fork espongono, ma per coincidenza e non per
# costruzione.
#
# Ora i driver dipendono dai fork per percorso, con un nome di pacchetto
# proprio (`plenora-fork-*`), e il fork arriva con la dipendenza. Questo
# consumatore e' la prova: dichiara solo `plenora-io-tools`, e
# `scripts/check_superficie_rust.py` verifica che il grafo risolto contenga i
# tre fork dall'archivio e nessun `gdal`, `shapefile` o `dxf` di crates.io.
[features]
# Il fork di `gdal` entra solo con il backend FileGDB: senza questa feature la
# prova non compilerebbe mai il terzo fork.
gdal-backend = ["plenora-io-tools/gdal-backend"]

[[bin]]
name = "consumatore-rust"
path = "src/main.rs"

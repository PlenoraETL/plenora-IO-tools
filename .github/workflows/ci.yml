name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "7 4 * * 1"
  # Callable so that release qualification runs these same functional gates on
  # the caller commit instead of re-declaring a drifting subset of them.
  workflow_call:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1, Node 24
      - name: Install GDAL
        run: sudo apt-get update && sudo apt-get install --yes libgdal-dev gdal-bin
      - name: Verify real feature-on FileGDB catalog evidence
        run: |
          python3 -m unittest scripts.test_check_filegdb_catalog
          ogrinfo --formats | grep -F OpenFileGDB
          cargo run --quiet -p plenora-io-cli --features gdal-backend --locked -- catalog |
            python3 scripts/check_filegdb_catalog.py
      - run: cargo fmt --all -- --check
      - name: Verify immutable GitHub Action references
        run: |
          python3 -m unittest scripts.test_check_action_pins
          python3 scripts/check_action_pins.py
      - name: Verify unique public identities
        run: |
          python3 -m unittest scripts.test_check_public_identity
          python3 scripts/check_public_identity.py
      - name: Verify the current contract registry
        run: |
          python3 -m unittest scripts.test_check_release_contract
          python3 scripts/check_release_contract.py
      - name: Verify the docset
        run: python3 scripts/check_docset.py
      - name: Verify shared WKB/EWKB corpus
        run: |
          python3 -m unittest scripts.test_compare_shared_wkb_observations
          python3 scripts/generate_shared_wkb_corpus.py --check
      - name: Verify exact dependency pins
        run: python3 scripts/check_dependency_pins.py
      # I pin di toolchain sono replicati come letterali in sei posti, perche'
      # un Dockerfile non legge un file fuori dal contesto di build e una CI
      # che facesse `source` renderebbe i pin invisibili a chi la legge. Il
      # rischio e' che un aggiornamento ne tocchi cinque su sei: fuzzing su un
      # nightly diverso da quello dell'immagine, o copertura misurata da due
      # versioni diverse dello stesso strumento.
      - name: Verify toolchain pins do not diverge
        run: |
          python3 -m unittest scripts.test_check_toolchain_pins
          python3 scripts/check_toolchain_pins.py
      # Lo scope della coverage e' "library coverage": la soglia vale sulle
      # librerie, non sull'attrezzaggio. La regex di esclusione e' derivata dal
      # workspace invece che ricopiata, cosi' una crate binaria nuova non entra
      # nel denominatore in silenzio — e nemmeno una libreria ne esce.
      - name: Verify the declared coverage scope
        run: |
          python3 -m unittest scripts.test_check_coverage_exclusions
          python3 scripts/check_coverage_exclusions.py
      # FZ-0: arrow-ipc e parquet convertono l'input con funzioni infallibili
      # che panicano su cio' che non riconoscono. I driver prevalidano prima di
      # consegnare, ma nulla lega le due chiamate: basta un percorso nuovo che
      # costruisca il reader senza passarci e il difetto rientra.
      - name: Verify no decoder is reached without prevalidation
        run: |
          python3 -m unittest scripts.test_check_prevalidazione_decoder
          python3 scripts/check_prevalidazione_decoder.py
      # FZ-0: la quarantena dei fuzz target e' vuota, e deve restare tale. Un
      # target quarantinato non viene eseguito dallo smoke, quindi le sue
      # regressioni nuove non le vede nessuno.
      - name: Verify the fuzz quarantine is empty
        run: |
          python3 -m unittest scripts.test_check_quarantena_fuzz
          python3 scripts/check_quarantena_fuzz.py
      - name: Verify governed GDAL fork
        run: python3 scripts/check_gdal_fork.py
      - name: Verify governed DXF fork
        run: python3 scripts/check_dxf_fork.py
      - name: Verify locked workspace and fuzz dependency graphs
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Verify reviewed semantic fallbacks
        run: |
          python3 -m unittest scripts.test_check_assurance_fallbacks
          bash scripts/check_assurance_fallbacks.sh
          bash scripts/test_s9_checkpoint.sh
      # Il modello budget legacy e' stato rimosso in S4.e. Il compilatore
      # impedisce di usare i tipi che non esistono, ma non impedisce a un
      # commit futuro di reintrodurli insieme ai propri usi.
      - name: Verify the legacy budget model has not returned
        run: python3 scripts/check_no_legacy_budget.py
      # S5 ha portato le quote configurate fino all'inferenza dei driver
      # tabellari. Il censimento tiene distinti i default legittimi dai
      # residui, e impedisce che ne compaia uno nuovo senza classificarlo.
      # La chiave e' `percorso::funzione`, non `percorso:riga`: le sonde
      # provano entrambi gli obblighi opposti — tollerare gli spostamenti,
      # accendersi su una nuova occorrenza.
      # S9: la migrazione ai costruttori redatti e' staged, e questo gate la
      # governa. Non conta quanti usi legacy restano nel workspace, conta
      # **dove**: un crate dichiarato migrato non puo' tornare indietro, e un
      # totale fermo non dimostra che niente si e' mosso.
      - name: Census legacy error constructors, per crate
        run: |
          python3 -m unittest scripts.test_check_quartetto_sito
          python3 scripts/check_quartetto_sito.py
          python3 -m unittest scripts.test_check_assurance_n1
          python3 scripts/check_assurance_n1.py --integrita
          python3 -m unittest scripts.test_check_errori_redatti
          python3 scripts/check_errori_redatti.py
      - name: Census WkbLimits::default() on production paths
        run: |
          python3 -m unittest scripts.test_check_wkb_limits_defaults
          python3 scripts/check_wkb_limits_defaults.py
      # INV-13 dichiara il permit non separabile dal bundle. Fra crate
      # distinti Rust non lo impone: il confine e' convenzionale e va
      # verificato, non solo dichiarato.
      - name: Verify the InputPermit workspace boundary
        run: python3 scripts/check_permit_boundary.py
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Il perimetro comprende i binari, non solo le librerie: `plenora-io-cli`
      # viene distribuito, e fino a questo commit il suo `main.rs` era l'unico
      # codice consegnato che poteva usare `unwrap`, `expect` o `panic!` senza
      # che nulla lo vedesse. Data Tools ha sempre girato il gate su
      # `--lib --bins`, questa e' la stessa forma.
      #
      # `plenora-bench` e `plenora-fuzz` restano fuori: sono attrezzaggio, non
      # vengono consegnati, e li' un `panic!` e' il modo giusto di fermarsi.
      # Sono esclusi per nome invece di elencare le crate da includere, cosi'
      # un binario nuovo in una crate distribuibile entra nel gate da solo.
      - name: Enforce safety lints on library and binary code
        run: >-
          cargo clippy --workspace --lib --bins --all-features --locked
          --exclude plenora-bench
          --exclude plenora-fuzz
          --
          -D warnings
          -D unsafe-code
          -D clippy::unwrap_used
          -D clippy::expect_used
          -D clippy::panic
          -D clippy::unreachable
          -D clippy::todo
          -D clippy::unimplemented
      - run: cargo test --workspace --all-targets --locked
      # `--all-targets` NON esegue i doctest. Il modello budget del Lotto 0
      # usa doctest `compile_fail` per provare invarianti che nessun test
      # runtime puo' dimostrare — un `PipelineBundle` non destrutturabile, un
      # `InputPermit` non clonabile, un `SourceFootprint` non costruibile,
      # trait delle parti sealed (INV-2, INV-13). Senza questo passo quei
      # gate esisterebbero nel sorgente ma non girerebbero mai.
      - name: Run doctests, including the compile-fail API gates
        run: cargo test --workspace --doc --locked
      - name: Test FileGDB crash recovery
        run: cargo test -p driver-filegdb --features gdal-backend --locked
      - name: Test cross-filesystem publish rejection
        env:
          PLENORA_CROSS_FS_TEST_ROOT: /dev/shm
        run: cargo test -p plenora-io-core cross_filesystem_publish_is_rejected_before_any_output_is_visible --locked
      - run: cargo build --workspace --release --locked
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2, cargo-audit
        with:
          tool: cargo-audit
      # Gli ID ignorati vengono dal registro, non da un elenco scritto qui: due
      # elenchi divergono, e il secondo non porta la ragione dell'eccezione.
      - name: Audit locked dependencies
        run: |
          set -euo pipefail
          python3 -m unittest scripts.test_audit_ignores
          # shellcheck disable=SC2046
          cargo audit --deny warnings $(python3 scripts/audit_ignores.py)

  # Unico job del repo che compila con un sanitizer. I driver leggono file
  # esterni non fidati: senza AddressSanitizer un difetto di memoria in una
  # dipendenza C (SQLite bundled, zlib, zstd) o un overflow aritmetico
  # resterebbe silenzioso finche' non produce un risultato sbagliato in
  # produzione. cargo-fuzz costruisce ogni target con -Zsanitizer=address e
  # overflow-checks attivi (fuzz/Cargo.toml, profile.release).
  fuzz:
    runs-on: ubuntu-latest
    env:
      # -Zsanitizer richiede nightly e vince su rust-toolchain.toml (1.92.0):
      # senza questa variabile cargo-fuzz userebbe la toolchain pinnata di
      # progetto e fallirebbe con "only accepted on nightly". La deroga vale
      # solo dentro questo job; nightly e' comunque fissato a una data, non al
      # canale mobile, ed e' la stessa di scripts/fuzz-campaign.sh.
      RUSTUP_TOOLCHAIN: nightly-2026-07-21
      # Smoke su ogni push; la finestra settimanale (schedule) alza il budget
      # senza cambiare il resto della configurazione.
      PLENORA_FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '300' || '60' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "nightly-2026-07-21"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1, Node 24
        with:
          workspaces: fuzz
      # Versione esatta: un cargo-fuzz mobile cambierebbe i flag passati a
      # libFuzzer fra due esecuzioni della stessa revisione.
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Verify locked fuzz dependency graph
        run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      # Costruisce TUTTI i target strumentati ed esegue quelli senza finding
      # aperti. I target elencati in fuzz/quarantine.txt restano compilati ma
      # non eseguiti: lo script li stampa a ogni run, così il debito resta
      # visibile invece di trasformare il gate in un rosso permanente.
      - name: Build and smoke every fuzz target under AddressSanitizer
        run: bash scripts/fuzz-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        if: failure()
        with:
          name: fuzz-crash-artifacts-${{ github.run_id }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1, Node 24
      - name: Install pinned GDAL/OpenFileGDB
        shell: pwsh
        run: >-
          ./scripts/install-windows-gdal.ps1
          -Destination "$env:RUNNER_TEMP\plenora-gdal"
          -CacheDirectory "$env:RUNNER_TEMP\plenora-osgeo4w-cache"
          -ExportGitHubEnvironment
      - name: Test FileGDB with native Windows GDAL
        run: cargo test -p driver-filegdb --features gdal-backend --locked
      - name: Benchmark native Windows FileGDB narrow path
        shell: pwsh
        run: ./scripts/check-windows-filegdb-benchmark.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: windows-filegdb-narrow-benchmark
          path: target/windows-filegdb-narrow-benchmark.json
          if-no-files-found: error
      - name: Test cross-volume publish rejection
        shell: pwsh
        run: |
          $tempDrive = (Get-Item $env:TEMP).PSDrive.Root
          $crossRoot = @($env:USERPROFILE, (Get-Location).Path) |
            Where-Object {
              (Test-Path $_) -and ((Get-Item $_).PSDrive.Root -ne $tempDrive)
            } |
            Select-Object -First 1
          if ($null -eq $crossRoot) {
            Write-Host "No second writable volume available; skipping cross-volume test."
            exit 0
          }
          $env:PLENORA_CROSS_FS_TEST_ROOT = $crossRoot
          cargo test -p plenora-io-core cross_filesystem_publish_is_rejected_before_any_output_is_visible --locked
      - run: cargo test --workspace --all-targets --locked

  gdal-linux-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            filegdb_write_available: false
          - os: ubuntu-24.04
            filegdb_write_available: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1, Node 24
      - name: Install distribution GDAL/OpenFileGDB
        run: sudo apt-get update && sudo apt-get install --yes libgdal-dev gdal-bin
      - name: Record native dependency and filesystem identities
        run: |
          gdal-config --version
          ogrinfo --formats | grep -F OpenFileGDB
          findmnt -T "$GITHUB_WORKSPACE" -o TARGET,SOURCE,FSTYPE,OPTIONS
          findmnt -T /dev/shm -o TARGET,SOURCE,FSTYPE,OPTIONS
      - name: Verify truthful runtime FileGDB availability
        run: |
          catalog_file="$(mktemp)"
          cargo run --quiet -p plenora-io-cli --features gdal-backend --locked -- catalog > "$catalog_file"
          python3 scripts/check_filegdb_catalog.py \
            --expect-available ${{ matrix.filegdb_write_available }} \
            "$catalog_file"
      - name: Test FileGDB against distribution GDAL
        if: matrix.filegdb_write_available
        run: cargo test -p driver-filegdb --features gdal-backend --locked
      - name: Test publish on runner filesystem and reject tmpfs crossing
        env:
          PLENORA_CROSS_FS_TEST_ROOT: /dev/shm
        run: |
          cargo test -p plenora-io-core publish::tests --locked
          cargo test -p plenora-io-core cross_filesystem_publish_is_rejected_before_any_output_is_visible --locked

  macos-publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1, Node 24
      - name: Test exclusive file and directory publish
        run: cargo test -p plenora-io-core publish::tests --locked
      - name: Check safety lints on the macOS publish implementation
        run: >-
          cargo clippy -p plenora-io-core --lib --locked --
          -D warnings
          -D unsafe-code
          -D clippy::unwrap_used
          -D clippy::expect_used
          -D clippy::panic
          -D clippy::unreachable
          -D clippy::todo
          -D clippy::unimplemented

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.92.0"
          components: llvm-tools-preview
      # Versione esatta, la stessa di Dockerfile.dev: la percentuale
      # confrontata con la soglia dipende da come lo strumento aggrega le
      # regioni, quindi la versione fa parte della misura. Senza pin, immagine
      # di sviluppo e CI potrebbero riportare due valori entrambi plausibili e
      # diversi. Allineamento verificato da scripts/check_toolchain_pins.py.
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2, cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.9.0
      - name: Measure coverage
        env:
          PLENORA_CROSS_FS_TEST_ROOT: /dev/shm
        run: cargo llvm-cov --workspace --all-targets --locked --no-report
      # Il report esportato porta le stesse esclusioni della soglia. Prima non
      # le portava, e l'artefatto pubblicato come "coverage" descriveva un
      # perimetro diverso da quello su cui la soglia veniva applicata: due
      # misure con lo stesso nome.
      - name: Export LCOV report
        run: >-
          cargo llvm-cov report --lcov --output-path lcov.info
          --ignore-filename-regex '(^|/)(plenora-bench|plenora-fuzz|plenora-io-cli)/src/.*\.rs$'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: rust-coverage-lcov
          path: lcov.info
      # La regex dichiara l'intenzione; questo passo legge il risultato. Un
      # binario nuovo sotto `src/bin/` non rientra piu' in silenzio nella
      # misura, e una regex troppo larga che togliesse una libreria dal
      # denominatore verrebbe vista allo stesso modo.
      - name: Verify the coverage report respects the declared scope
        run: python3 scripts/check_coverage_exclusions.py --lcov lcov.info
      - name: Enforce library coverage threshold
        run: >-
          cargo llvm-cov report --summary-only
          --ignore-filename-regex '(^|/)(plenora-bench|plenora-fuzz|plenora-io-cli)/src/.*\.rs$'
          --fail-under-lines 80

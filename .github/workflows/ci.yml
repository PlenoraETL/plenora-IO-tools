name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "7 4 * * 1"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install GDAL
        run: sudo apt-get update && sudo apt-get install --yes libgdal-dev
      - run: cargo fmt --all -- --check
      - name: Verify immutable GitHub Action references
        run: |
          python3 -m unittest scripts.test_check_action_pins
          python3 scripts/check_action_pins.py
      - name: Verify exact dependency pins
        run: python3 scripts/check_dependency_pins.py
      - name: Verify locked workspace and fuzz dependency graphs
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Verify reviewed semantic fallbacks
        run: bash scripts/check_assurance_fallbacks.sh
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Enforce safety lints on library code
        run: >-
          cargo clippy --workspace --lib --all-features --locked --
          -D warnings
          -D unsafe-code
          -D clippy::unwrap_used
          -D clippy::expect_used
          -D clippy::panic
          -D clippy::unreachable
          -D clippy::todo
          -D clippy::unimplemented
      - run: cargo test --workspace --all-targets --locked
      - name: Test FileGDB crash recovery
        run: cargo test -p driver-filegdb --features gdal-backend --locked
      - name: Test cross-filesystem publish rejection
        env:
          PLENORA_CROSS_FS_TEST_ROOT: /dev/shm
        run: cargo test -p plenora-io-core cross_filesystem_publish_is_rejected_before_any_output_is_visible --locked
      - run: cargo build --workspace --release --locked
      - uses: taiki-e/install-action@f1b61bf3a1373bccc1ebdc11506122709bd40dee # cargo-audit
      - name: Audit locked dependencies
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2023-0089
          --ignore RUSTSEC-2024-0436

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Test cross-volume publish rejection
        shell: pwsh
        run: |
          $tempDrive = (Get-Item $env:TEMP).PSDrive.Root
          $crossRoot = @($env:USERPROFILE, (Get-Location).Path) |
            Where-Object {
              (Test-Path $_) -and ((Get-Item $_).PSDrive.Root -ne $tempDrive)
            } |
            Select-Object -First 1
          if ($null -eq $crossRoot) {
            Write-Host "No second writable volume available; skipping cross-volume test."
            exit 0
          }
          $env:PLENORA_CROSS_FS_TEST_ROOT = $crossRoot
          cargo test -p plenora-io-core cross_filesystem_publish_is_rejected_before_any_output_is_visible --locked
      - run: cargo test --workspace --all-targets --locked

  macos-publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Test exclusive file and directory publish
        run: cargo test -p plenora-io-core publish::tests --locked
      - name: Check safety lints on the macOS publish implementation
        run: >-
          cargo clippy -p plenora-io-core --lib --locked --
          -D warnings
          -D unsafe-code
          -D clippy::unwrap_used
          -D clippy::expect_used
          -D clippy::panic
          -D clippy::unreachable
          -D clippy::todo
          -D clippy::unimplemented

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.92.0"
          components: llvm-tools-preview
      - uses: taiki-e/install-action@8dc1a448f03edf5b0d5a9bb37d054545b2fe246e # cargo-llvm-cov
      - name: Measure coverage
        env:
          PLENORA_CROSS_FS_TEST_ROOT: /dev/shm
        run: cargo llvm-cov --workspace --all-targets --locked --no-report
      - name: Export LCOV report
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-coverage-lcov
          path: lcov.info
      - name: Enforce library coverage threshold
        run: >-
          cargo llvm-cov report --summary-only
          --ignore-filename-regex '(^|/)(plenora-bench|plenora-fuzz|plenora-io-cli)/src/main\.rs$'
          --fail-under-lines 80

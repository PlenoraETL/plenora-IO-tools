# I quattro artefatti, costruiti e verificati ciascuno sulla propria piattaforma.
#
# Due piattaforme per due profili. macOS e' **fuori dal perimetro** della v1 --
# una decisione di prodotto registrata in `distribuzione-matrice.json` sotto
# `piattaforme_non_distribuite`, non un job che manca -- e il gate finale
# deriva il perimetro da li'.
#
# # Perche' job nativi e non una cross-compilazione
#
# Perche' cio' che si verifica non e' il binario ma l'**artefatto**: la chiusura
# delle sue dipendenze, i percorsi che porta cotti dentro, e se funziona una
# volta spostato. Un artefatto macOS costruito su Linux non si puo' eseguire, e
# uno smoke che non si esegue non dice niente.
#
# Ogni job produce dei **referti**, che il gate finale riconta. Non basta che i
# job siano verdi: un job verde e' un'affermazione fatta da chi doveva essere
# verificato, e le affermazioni si sbagliano in silenzio -- un passo saltato per
# una condizione mai vera, un `|| true` di troppo, uno smoke che non ha trovato
# l'artefatto e non ha guardato niente. Nessuna di queste cose fa rosso.
#
# # Il canale
#
# Di norma `prova`: artefatti costruiti per essere misurati, non installati.
# Il canale `candidate` si chiede a mano. La 2.0.0 non richiede una firma di
# piattaforma ne' su Linux ne' su Windows: i manifesti lo dichiarano, mentre
# checksum, provenance e tutte le verifiche dell'artefatto restano obbligatori.
#
# # Come si avvia, e l'impalcatura che non c'e' piu'
#
# Solo a mano, con `workflow_dispatch`. Non c'e' nessun trigger automatico, ed
# e' voluto: costruire e verificare quattro artefatti nativi e' una cosa che si
# chiede, non che capita a ogni push.
#
# C'e' stato un trigger `push` limitato a un branch, per una ragione precisa:
# `workflow_dispatch` non puo' avviare un workflow che non esiste ancora sul
# branch predefinito -- una condizione di GitHub, non una scelta -- e la prima
# corsa di scoperta su Windows non aveva altro modo di partire. Era
# un'impalcatura, ha fatto il proprio lavoro, ed e' stata tolta: le corse
# Windows sono verdi, il contratto runtime PE e' scritto dai rilievi che quelle
# corse hanno prodotto, e un trigger che sopravvive alla ragione per cui e'
# nato consuma runner per corse che nessuno ha chiesto.

name: Distribuzione

on:
  workflow_dispatch:
    inputs:
      canale:
        description: "prova (predefinito) oppure candidate"
        type: choice
        options: [prova, candidate]
        default: prova
      versione:
        description: "la versione nel nome dell'artefatto"
        type: string
        default: "0.0.0-prova"

permissions:
  contents: read

env:
  CANALE: ${{ inputs.canale || 'prova' }}
  VERSIONE: ${{ inputs.versione || '0.0.0-prova' }}

jobs:
  linux:
    # Ubuntu 22.04, che porta glibc 2.35: e' la soglia dichiarata nella matrice.
    # Costruire su una base piu' recente darebbe un artefatto che non gira sulla
    # soglia promessa, per un accidente dell'ambiente invece che per una
    # proprieta' del prodotto.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profilo: [base, filegdb]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.92.0"
      - name: Strumenti nativi
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config zstd binutils patchelf strace file

      - name: Materializza il runtime GDAL fissato
        run: python3 scripts/install-linux-gdal.py
          --prefisso "$RUNNER_TEMP/runtime" --lavoro "$RUNNER_TEMP/cache"

      - name: Costruisci l'artefatto
        run: python3 scripts/costruisci-artefatto-linux.py
          --prefisso "$RUNNER_TEMP/runtime" --uscita "$RUNNER_TEMP/uscita"
          --versione "$VERSIONE" --profilo "${{ matrix.profilo }}" --canale "$CANALE"
          --referti "$RUNNER_TEMP/referti"

      # L'ordine e' quello deciso: assembla, dichiara la politica di firma,
      # checksum, smoke. Nessuna piattaforma della 2.0.0 richiede una firma; il
      # manifesto lo rende esplicito invece di lasciarlo dedurre.
      # Anche il profilo base: dimostra con un conteggio che non spedisce
      # librerie, invece di lasciarlo dedurre dall'assenza del referto.
      - name: Verifica il runtime
        run: python3 scripts/check-linux-gdal-runtime.py
          --prefisso "$RUNNER_TEMP/uscita/plenora-io-$VERSIONE-linux-x86_64-${{ matrix.profilo }}"
          --radice bin/plenora-io
          --referto "$RUNNER_TEMP/referti/linux-${{ matrix.profilo }}-runtime.json"

      - name: Verifica le licenze
        run: python3 scripts/check-licenze-artefatto.py
          --albero "$RUNNER_TEMP/uscita/plenora-io-$VERSIONE-linux-x86_64-${{ matrix.profilo }}"
          --referto "$RUNNER_TEMP/referti/linux-${{ matrix.profilo }}-licenze.json"

      - name: Smoke del profilo, sull'artefatto installato
        run: python3 scripts/smoke-profilo.py
          --albero "$RUNNER_TEMP/uscita/plenora-io-$VERSIONE-linux-x86_64-${{ matrix.profilo }}"
          --lavoro "$RUNNER_TEMP/smoke"
          --referto "$RUNNER_TEMP/referti/linux-${{ matrix.profilo }}-smoke.json"

      # Il relocation smoke **cancella** la directory di costruzione: e' la sua
      # condizione centrale, e per questo l'archivio viene copiato altrove prima.
      # Entrambi i profili: la premessa «il base non spedisce librerie» era
      # falsa -- su Windows spedisce il runtime C -- e comunque che l'artefatto
      # funzioni dove e' stato costruito non e' cio' che si promette a chi
      # installa. Va estratto in una directory nuova e provato dall'archivio.
      - name: Relocation smoke
        run: |
          mkdir -p "$RUNNER_TEMP/archivi"
          cp "$RUNNER_TEMP/uscita/plenora-io-$VERSIONE-linux-x86_64-${{ matrix.profilo }}.tar.gz" \
             "$RUNNER_TEMP/archivi/"
          bash scripts/relocation-smoke-linux.sh \
            "$RUNNER_TEMP/archivi/plenora-io-$VERSIONE-linux-x86_64-${{ matrix.profilo }}.tar.gz" \
            "$RUNNER_TEMP/uscita/plenora-io-$VERSIONE-linux-x86_64-${{ matrix.profilo }}" \
            "$RUNNER_TEMP/relocation" \
            "$RUNNER_TEMP/referti/linux-${{ matrix.profilo }}-relocation.json"

      # I digest del manifesto, ricalcolati sull'albero **estratto**: fra il
      # manifesto e chi riceve ci sono l'archiviazione e l'estrazione, e sono i
      # passaggi in cui un file puo' cambiare senza che nessuno lo noti.
      - name: Verifica i digest del manifesto sull'albero estratto
        run: |
          ESTRATTO="$RUNNER_TEMP/estratto-${{ matrix.profilo }}"
          rm -rf "$ESTRATTO" && mkdir -p "$ESTRATTO"
          tar -xzf "$RUNNER_TEMP/archivi/plenora-io-$VERSIONE-linux-x86_64-${{ matrix.profilo }}.tar.gz"               -C "$ESTRATTO"
          python3 scripts/check-digest-manifesto.py             --albero "$ESTRATTO/plenora-io-$VERSIONE-linux-x86_64-${{ matrix.profilo }}"             --referto "$RUNNER_TEMP/referti/linux-${{ matrix.profilo }}-digest-manifesto.json"

      # I referti dimostrano che l'oggetto era buono; non sono l'oggetto.
      # Senza questo upload archivio, checksum e provenance morirebbero col
      # runner, e una candidate verde non consegnerebbe niente da installare.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: deliverable-linux-${{ matrix.profilo }}-${{ env.VERSIONE }}
          path: |
            ${{ runner.temp }}/uscita/plenora-io-${{ env.VERSIONE }}-linux-x86_64-${{ matrix.profilo }}.tar.gz
            ${{ runner.temp }}/uscita/plenora-io-${{ env.VERSIONE }}-linux-x86_64-${{ matrix.profilo }}.tar.gz.sha256
            ${{ runner.temp }}/uscita/plenora-io-${{ env.VERSIONE }}-linux-x86_64-${{ matrix.profilo }}.tar.gz.provenance.json
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        if: always()
        with:
          name: referti-linux-${{ matrix.profilo }}
          path: ${{ runner.temp }}/referti/

  windows:
    # `windows-2022` e non `windows-latest`: la versione del runner e' parte di
    # cio' che si fissa, e «latest» cambia sotto i piedi.
    #
    # # Due fasi, e la prima non qualifica
    #
    # L'insieme delle DLL di sistema attese non esiste ancora, e non si scrive a
    # tavolino: dipende da come conda-forge ha compilato GDAL per win-64, e
    # l'unico modo di saperlo e' guardare un artefatto vero.
    #
    # La prima corsa **scopre**: costruisce, misura, scrive il rilievo, lo
    # carica come artefatto, e termina **rossa**. Il rosso non e' un difetto
    # trovato: e' l'assenza di una revisione umana. Una corsa di scoperta che
    # potesse diventare verde da sola scriverebbe il proprio contratto, e un
    # contratto scritto da cio' che deve verificare non verifica niente.
    #
    # Poi il rilievo si rilegge, ogni dipendenza si classifica -- interna,
    # API-set, ABI Windows attesa, oppure inattesa e bloccante -- e **un commit
    # successivo** mette nel lock l'insieme esatto, per profilo, insieme al
    # digest del rilievo da cui viene. Solo allora la seconda corsa confronta il
    # reale con l'atteso, e puo' diventare verde.
    runs-on: windows-2022
    # Un passo che si blocca deve fallire presto. Il default di GitHub e' sei
    # ore: due corse di scoperta si sono appese su un comando in attesa di
    # input, e senza un tetto avrebbero consumato runner per un pomeriggio
    # ciascuna senza dire niente di piu' di quanto dicano in venti minuti.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profilo: [base, filegdb]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.92.0"

      # Il timeout sta sul **passo** e non solo sul job: quando scade il job,
      # scadono anche i passi `if: always()`, e il diario -- l'unica cosa che
      # dice dove si e' fermato -- non viene raccolto. Con il tetto sul passo,
      # il passo fallisce e i successivi girano.
      - name: Materializza il runtime GDAL fissato
        timeout-minutes: 20
        shell: pwsh
        run: >-
          ./scripts/install-windows-gdal.ps1
          -Destination "$env:RUNNER_TEMP\runtime"
          -CacheDirectory "$env:RUNNER_TEMP\cache"

      # Il diario dell'installatore va raccolto **sempre**: l'output di un passo
      # in corso si perde quando il job scade, e senza diario non si diagnostica
      # nulla. Le prime due corse di scoperta si sono fermate proprio li'.
      - name: Raccogli il diario dell'installatore
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/discovery"
          cp "${TMP:-$TEMP}/install-windows-gdal.log"              "$RUNNER_TEMP/discovery/install-windows-gdal-${{ matrix.profilo }}.log" 2>/dev/null ||              echo "nessun diario prodotto" > "$RUNNER_TEMP/discovery/install-windows-gdal-${{ matrix.profilo }}.log"

      - name: Costruisci l'artefatto
        shell: bash
        run: python scripts/costruisci-artefatto-windows.py
          --prefisso "$RUNNER_TEMP/runtime" --uscita "$RUNNER_TEMP/uscita"
          --versione "$VERSIONE" --profilo "${{ matrix.profilo }}" --canale "$CANALE"
          --referti "$RUNNER_TEMP/referti"

      # --- fase 1: la scoperta -----------------------------------------
      #
      # `continue-on-error` perche' il rosso e' **atteso**: il passo deve
      # fallire e il rilievo deve essere conservato lo stesso. Senza, l'unica
      # cosa prodotta da questa corsa andrebbe persa proprio perche' ha fatto
      # cio' che doveva.
      # Il manifesto dell'artefatto va conservato insieme al rilievo: chi
      # rilegge la scoperta deve poter confrontare cio' che il rilievo misura
      # con cio' che l'artefatto dichiara di se'. Sono due documenti diversi e
      # servono insieme.
      - name: Conserva il manifesto dell'artefatto
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/discovery"
          cp "$RUNNER_TEMP/uscita/plenora-io-$VERSIONE-windows-x86_64-${{ matrix.profilo }}/MANIFEST.json"              "$RUNNER_TEMP/discovery/windows-${{ matrix.profilo }}-MANIFEST.json" 2>/dev/null ||              echo '{"errore":"manifesto non prodotto"}' > "$RUNNER_TEMP/discovery/windows-${{ matrix.profilo }}-MANIFEST.json"

      - name: Scoperta del runtime (non qualificante, termina rossa)
        id: scoperta
        continue-on-error: true
        shell: bash
        run: python scripts/check-windows-runtime.py
          --albero "$RUNNER_TEMP/uscita/plenora-io-$VERSIONE-windows-x86_64-${{ matrix.profilo }}"
          --discovery "$RUNNER_TEMP/discovery/windows-${{ matrix.profilo }}-discovery.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        if: always()
        with:
          name: discovery-windows-${{ matrix.profilo }}
          path: ${{ runner.temp }}/discovery/

      # --- fase 2: la verifica, quando il contratto esiste --------------
      #
      # Gira solo se il lock porta un `contratto_di_verifica`. Finche' non c'e',
      # questo passo e' saltato e il job resta rosso per il passo di scoperta:
      # e' l'esito giusto, e dice quale delle due fasi manca.
      - name: Il lock porta gia un contratto di verifica?
        id: contratto
        shell: bash
        run: |
          if python -c "import json,sys; d=json.load(open('scripts/windows-gdal-lock.json')); sys.exit(0 if 'contratto_di_verifica' in d else 1)"; then
            echo "presente=si" >> "$GITHUB_OUTPUT"
          else
            echo "presente=no" >> "$GITHUB_OUTPUT"
            echo "Il lock non porta ancora un contratto di verifica: la scoperta e' la sola fase possibile."
          fi

      - name: Verifica il runtime
        if: steps.contratto.outputs.presente == 'si'
        shell: bash
        run: python scripts/check-windows-runtime.py
          --albero "$RUNNER_TEMP/uscita/plenora-io-$VERSIONE-windows-x86_64-${{ matrix.profilo }}"
          --referto "$RUNNER_TEMP/referti/windows-${{ matrix.profilo }}-runtime.json"

      - name: Verifica le licenze
        if: steps.contratto.outputs.presente == 'si'
        shell: bash
        run: python scripts/check-licenze-artefatto.py
          --albero "$RUNNER_TEMP/uscita/plenora-io-$VERSIONE-windows-x86_64-${{ matrix.profilo }}"
          --referto "$RUNNER_TEMP/referti/windows-${{ matrix.profilo }}-licenze.json"

      - name: Smoke del profilo, sull'artefatto installato
        if: steps.contratto.outputs.presente == 'si'
        shell: bash
        run: python scripts/smoke-profilo.py
          --albero "$RUNNER_TEMP/uscita/plenora-io-$VERSIONE-windows-x86_64-${{ matrix.profilo }}"
          --lavoro "$RUNNER_TEMP/smoke"
          --referto "$RUNNER_TEMP/referti/windows-${{ matrix.profilo }}-smoke.json"

      # La scoperta del binario su Windows, che nessun altro job esercita.
      #
      # Senza referto, ed e' voluto: le coordinate di `smoke-installato` sono
      # `any/<formato>`, una coppia sola per tutta la corsa, e un secondo
      # referto da qui collinderebbe con quello del job `python`. La prova
      # continua a fare il proprio mestiere -- se l'SDK non trovasse il binario,
      # o ne leggesse male il manifesto, questo job diventerebbe rosso -- e
      # quello che entra nel conteggio resta uno.
      - name: L'SDK installato trova il binario anche su Windows
        shell: pwsh
        run: |
          python scripts/costruisci-pacchetto-python.py --uscita "$env:RUNNER_TEMP/pacchetto"
          # Il nome per esteso, non la prima directory che capita: in
          # `uscita/` il costruttore lascia anche `.testi-di-licenza`, che il
          # punto iniziale manda in testa all'ordine alfabetico. Era quella che
          # veniva passata all'SDK, e l'errore diceva -- correttamente -- che li'
          # dentro non c'era nessun binario.
          $albero = "$env:RUNNER_TEMP/uscita/plenora-io-$env:VERSIONE-windows-x86_64-${{ matrix.profilo }}"
          $wheel = (Get-ChildItem "$env:RUNNER_TEMP/pacchetto/*.whl")[0].FullName
          python scripts/smoke-sdk-installato.py `
            --albero "$albero" --pacchetto "$wheel" --formato wheel `
            --profilo-dell-albero "${{ matrix.profilo }}" `
            --piattaforma-dell-albero windows-x86_64 --canale "$env:CANALE"

      # Il relocation smoke: A cancellata, B con un percorso di lunghezza
      # diversa, terza directory, PATH ridotto e sentinelle. Su Windows manca
      # l'equivalente di `strace`, e il commento in testa allo script dice che
      # cosa vale al posto suo.
      - name: Relocation smoke
        if: steps.contratto.outputs.presente == 'si'
        shell: pwsh
        run: |
          $nome = "plenora-io-$env:VERSIONE-windows-x86_64-${{ matrix.profilo }}"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\archivi" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\uscita\$nome.zip" "$env:RUNNER_TEMP\archivi\"
          ./scripts/relocation-smoke-windows.ps1 `
            -Archivio "$env:RUNNER_TEMP\archivi\$nome.zip" `
            -DirectoryA "$env:RUNNER_TEMP\uscita\$nome" `
            -Lavoro "$env:RUNNER_TEMP\relocation" `
            -Referto "$env:RUNNER_TEMP\referti\windows-${{ matrix.profilo }}-relocation.json"

      # I digest del manifesto, sull'albero estratto dall'archivio.
      - name: Verifica i digest del manifesto sull'albero estratto
        if: steps.contratto.outputs.presente == 'si'
        shell: bash
        run: |
          NOME="plenora-io-$VERSIONE-windows-x86_64-${{ matrix.profilo }}"
          ESTRATTO="$RUNNER_TEMP/estratto-${{ matrix.profilo }}"
          rm -rf "$ESTRATTO" && mkdir -p "$ESTRATTO"
          unzip -q "$RUNNER_TEMP/archivi/$NOME.zip" -d "$ESTRATTO"
          python scripts/check-digest-manifesto.py --albero "$ESTRATTO/$NOME" \
            --referto "$RUNNER_TEMP/referti/windows-${{ matrix.profilo }}-digest-manifesto.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: deliverable-windows-${{ matrix.profilo }}-${{ env.VERSIONE }}
          path: |
            ${{ runner.temp }}/uscita/plenora-io-${{ env.VERSIONE }}-windows-x86_64-${{ matrix.profilo }}.zip
            ${{ runner.temp }}/uscita/plenora-io-${{ env.VERSIONE }}-windows-x86_64-${{ matrix.profilo }}.zip.sha256
            ${{ runner.temp }}/uscita/plenora-io-${{ env.VERSIONE }}-windows-x86_64-${{ matrix.profilo }}.zip.provenance.json
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        if: always()
        with:
          name: referti-windows-${{ matrix.profilo }}
          path: ${{ runner.temp }}/referti/

      # Il job e' verde quando le **verifiche** sono verdi.
      #
      # La scoperta fallisce sempre: e' il suo mestiere, e continua a girare
      # anche quando il contratto c'e' perche' il rilievo documenta la corsa. La
      # prima stesura di questo passo la trattava come un difetto quando il
      # contratto era presente, e teneva rosso un job in cui tutto era andato
      # bene: confondeva «ha fatto cio' che doveva» con «e' fallito».
      - name: Esito
        shell: bash
        run: |
          if [ "${{ steps.contratto.outputs.presente }}" != "si" ]; then
            echo "Corsa di scoperta: il rilievo e' stato prodotto e caricato, e il contratto"
            echo "va ora scritto rileggendolo. Questo job resta rosso di proposito."
            exit 1
          fi
          echo "Il contratto c'e' ed e' stato applicato: runtime, licenze, smoke, relocation"
          echo "e digest hanno prodotto i propri referti. Il rosso della scoperta e' atteso -- "
          echo "quella fase non qualifica, e continua a girare per documentare la corsa."

  # I due artefatti Python, che non hanno una piattaforma.
  #
  # # Perche' un job e non due passi dentro `linux`
  #
  # Perche' le coordinate di questi referti sono `any/wheel` e `any/sdist`: una
  # coppia sola, mentre `linux` gira due volte -- una per profilo -- e
  # produrrebbe due referti sulle stesse coordinate. Il gate li conterebbe come
  # un duplicato, e avrebbe ragione: un artefatto che non ha piattaforma non si
  # qualifica una volta per piattaforma.
  #
  # # Perche' dipende da `linux`
  #
  # Perche' cio' che va dimostrato non e' che il pacchetto si installi -- quello
  # lo prova `smoke-pacchetto-python.sh` in venv puliti -- ma che l'SDK
  # **trovi** un binario vero, ne legga il manifesto e ne riconosca il profilo.
  # Il binario non sta dentro il pacchetto, ed e' una scelta: questo job e' il
  # modo in cui quella scelta si paga.
  #
  # La wheel si prova contro l'albero `filegdb` e la sdist contro il `base`.
  # Provarle entrambe contro lo stesso albero avrebbe lasciato un profilo mai
  # esercitato da questo lato, e sono i due che si comportano diversamente:
  # `require_profile("filegdb")` deve passare sull'uno e sollevare sull'altro.
  python:
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      # L'interprete si dichiara. L'immagine `ubuntu-22.04` porta Python 3.10, e
      # il pacchetto ne pretende almeno 3.11: l'installazione falliva con
      # «requires a different Python», che e' il `Requires-Python` che fa
      # esattamente il proprio mestiere.
      #
      # 3.11 e non l'ultima: e' il **limite inferiore** dichiarato, ed e' quello
      # che vale la pena esercitare qui. Le altre due versioni della matrice le
      # prova il job `python-sdk` della CI a ogni push.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0, Node 24
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0, Node 24
        with:
          pattern: deliverable-linux-*
          path: nativi
          merge-multiple: true

      - name: Estrai i due alberi nativi
        run: |
          mkdir -p "$RUNNER_TEMP/alberi"
          for profilo in base filegdb; do
            tar -xzf "nativi/plenora-io-$VERSIONE-linux-x86_64-$profilo.tar.gz" \
              -C "$RUNNER_TEMP/alberi"
          done
          ls "$RUNNER_TEMP/alberi"

      # Gli stessi byte per tutto il resto del job: si costruisce una volta, e
      # cio' che si prova e' cio' che si consegna. Ricostruire fra una verifica
      # e l'altra darebbe archivi diversi da quelli descritti dai referti --
      # identici quasi sempre, che e' precisamente il motivo per cui la
      # differenza passerebbe inosservata.
      - name: Costruisci wheel e sdist
        run: python3 scripts/costruisci-pacchetto-python.py
          --uscita "$RUNNER_TEMP/pacchetto" --referti "$RUNNER_TEMP/referti"

      - name: La costruzione e' riproducibile
        run: bash scripts/verifica-riproducibilita-python.sh

      - name: Smoke del pacchetto in ambienti puliti
        run: bash scripts/smoke-pacchetto-python.sh "$RUNNER_TEMP/pacchetto"

      - name: La wheel installata, contro l'artefatto filegdb
        run: python3 scripts/smoke-sdk-installato.py
          --albero "$RUNNER_TEMP/alberi/plenora-io-$VERSIONE-linux-x86_64-filegdb"
          --pacchetto "$(ls "$RUNNER_TEMP"/pacchetto/*.whl)"
          --formato wheel --profilo-dell-albero filegdb
          --piattaforma-dell-albero linux-x86_64 --canale "$CANALE"
          --referto "$RUNNER_TEMP/referti/python-wheel-smoke-installato.json"

      - name: La sdist installata, contro l'artefatto base
        run: python3 scripts/smoke-sdk-installato.py
          --albero "$RUNNER_TEMP/alberi/plenora-io-$VERSIONE-linux-x86_64-base"
          --pacchetto "$(ls "$RUNNER_TEMP"/pacchetto/*.tar.gz)"
          --formato sdist --profilo-dell-albero base
          --piattaforma-dell-albero linux-x86_64 --canale "$CANALE"
          --referto "$RUNNER_TEMP/referti/python-sdist-smoke-installato.json"

      - name: Il canale resta privato
        run: python3 scripts/check_canale_privato.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: deliverable-python-${{ env.VERSIONE }}
          path: |
            ${{ runner.temp }}/pacchetto/*.whl
            ${{ runner.temp }}/pacchetto/*.tar.gz
            ${{ runner.temp }}/pacchetto/*.sha256
            ${{ runner.temp }}/pacchetto/MANIFEST.json
            ${{ runner.temp }}/pacchetto/provenance.json
            ${{ runner.temp }}/pacchetto/sbom.json
            ${{ runner.temp }}/pacchetto/licenze.json
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        if: always()
        with:
          name: referti-python
          path: ${{ runner.temp }}/referti/

  # Il gate finale: **ricontare**.
  #
  # Senza di lui i job verdi si leggevano come «la distribuzione e' completa», e
  # non era la stessa affermazione: ogni job sa di se stesso, e nessuno sapeva
  # se tutti gli artefatti attesi esistessero, con tutte le verifiche previste e
  # con le misure obbligatorie dentro. Un referto mancante non rende rosso
  # nessun job -- semplicemente non c'e' -- ed e' la forma di falso verde piu'
  # facile da non vedere, perche' si manifesta come assenza.
  #
  # Ricalcola il perimetro dalla matrice, non da cio' che ha ricevuto: il numero
  # degli artefatti discende dalle classi dichiarate -- quattro nativi, due
  # Python -- non dal fatto che tre job siano stati scritti.
  gate:
    needs: [linux, windows, python]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      # `needs` con `if: always()` fa girare questo job anche quando un
      # costruttore fallisce, ed e' voluto: il gate deve poter dire **che cosa**
      # manca. Ma un costruttore rosso non puo' diventare una distribuzione
      # verde per il fatto che il gate ha girato, quindi il suo esito si legge
      # per primo.
      - name: I costruttori sono verdi?
        run: |
          echo "linux:   ${{ needs.linux.result }}"
          echo "windows: ${{ needs.windows.result }}"
          echo "python:  ${{ needs.python.result }}"
          if [ "${{ needs.linux.result }}" != "success" ] || [ "${{ needs.windows.result }}" != "success" ] || [ "${{ needs.python.result }}" != "success" ]; then
            echo "Un costruttore non e' verde: il conteggio dei referti qui sotto dira' che"
            echo "cosa manca, ma questa corsa non distribuisce niente."
            exit 1
          fi
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0, Node 24
        with:
          pattern: referti-*
          path: referti
      - name: Riconta i referti contro la matrice
        run: python3 scripts/check-distribuzione-completa.py --referti referti --canale "$CANALE"
      # Verifica cio' che e' tornato dal servizio artifact. Ricalcolare prima
      # dell'upload dimostrerebbe i byte sul runner produttore, non quelli che
      # chi scarica ricevera'. `merge-multiple` e l'elenco chiuso nel controllo
      # rendono rossi anche file mancanti o inattesi.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0, Node 24
        with:
          pattern: deliverable-*
          path: deliverable
          merge-multiple: true
      - name: Verifica i deliverable dopo l'upload
        run: python3 scripts/check-deliverable.py
          --directory deliverable --versione "$VERSIONE" --canale "$CANALE"
          --revisione "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        if: always()
        with:
          name: referti-di-tutta-la-distribuzione
          path: referti/

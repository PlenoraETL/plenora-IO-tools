name: Release checkout qualification

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact 40-character commit SHA to qualify
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  functional-gates:
    uses: ./.github/workflows/ci.yml

  qualify-current-checkout:
    needs: functional-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Test release qualification semantics
        run: |
          python3 -m unittest scripts.test_check_release_contract
          python3 -m unittest scripts.test_check_assurance_n1_prove
      # ASSURANCE-N1 e' release-blocking: un ramo d'errore che nessuna verifica
      # esegue non e' un debito rinviabile oltre la qualifica. La modalita'
      # `--integrita` gira in CI e dice soltanto che il registro e' coerente;
      # qui serve `--release`, che e' rossa finche' il debito non e' a zero.
      - name: ASSURANCE-N1 coverage debt must be zero
        run: |
          python3 -m unittest scripts.test_check_assurance_n1
          python3 scripts/check_assurance_n1.py --release
      # Il legame fra la qualifica e l'esatto checkout resta, ed e' scritto qui
      # invece che dentro un gate: sono tre condizioni indipendenti, e
      # nasconderle in uno script il cui scopo e' un'altra cosa le rende
      # difficili da leggere e facili da perdere.
      - name: Qualify the exact clean checkout selected by GitHub
        env:
          EXPECTED_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_revision || github.sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [[ "$head" != "$EXPECTED_REVISION" ]]; then
            echo "HEAD $head non e' la revisione attesa $EXPECTED_REVISION" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "albero sporco: la qualifica non sarebbe same-SHA" >&2
            exit 1
          fi
          python3 scripts/check_release_contract.py --release

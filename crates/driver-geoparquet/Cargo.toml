[package]
name = "driver-geoparquet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license-file.workspace = true

[lints]
workspace = true

[dependencies]
plenora-io-model = { path = "../plenora-io-model" }
plenora-io-core = { path = "../plenora-io-core" }
driver-common = { path = "../driver-common" }
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
jsonschema.workspace = true
parquet.workspace = true
base64.workspace = true
geo-types.workspace = true
# Rilettura 11: `serde_json::value::RawValue` conserva i byte del documento
# PROJJSON del campo `crs`, in lettura e in scrittura. La feature `raw_value`
# e' gia' nel grafo del workspace (la abilita `driver-geojson`, che compila
# nello stesso artefatto): qui la si dichiara invece di contare
# sull'unificazione delle feature. Non porta dipendenze.
serde_json = { workspace = true, features = ["raw_value"] }
tempfile.workspace = true

[package]
name = "driver-geojson"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
plenora-io-model = { path = "../plenora-io-model" }
plenora-io-core = { path = "../plenora-io-core" }
driver-common = { path = "../driver-common" }
arrow-array.workspace = true
arrow-schema.workspace = true
geojson.workspace = true
geo-types.workspace = true
serde.workspace = true
# Finding #6 review 2026-08-15: `serde_json::value::RawValue` serve al
# `FeatureSink` per cappare la dimensione di una singola geometria GeoJSON
# prima di deserializzarla nella struttura tipizzata `GjGeometry`. La
# feature `raw_value` non porta dipendenze aggiuntive: espone solo il
# newtype `RawValue` che serde_json usa internamente.
serde_json = { workspace = true, features = ["raw_value"] }
tempfile.workspace = true

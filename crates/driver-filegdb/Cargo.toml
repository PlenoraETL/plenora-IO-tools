[package]
name = "driver-filegdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
plenora-io-model = { path = "../plenora-io-model" }
plenora-io-core = { path = "../plenora-io-core" }
driver-common = { path = "../driver-common" }
arrow-array.workspace = true
arrow-schema.workspace = true
serde_json.workspace = true
gdal = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
# "tier GDB": FileGDB via GDAL (dipendenza C). Assente di default → stub.
gdal-backend = ["dep:gdal"]
# Assurance-only binding generation for GDAL 3.10 on the pinned Windows matrix.
gdal-bindgen = ["gdal-backend", "gdal/bindgen"]

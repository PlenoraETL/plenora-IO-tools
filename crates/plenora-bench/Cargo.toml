[package]
name = "plenora-bench"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "plenora-bench"
path = "src/main.rs"

[dependencies]
plenora-core = { path = "../plenora-core", features = ["metrics"] }
plenora-io-core = { path = "../plenora-io-core" }
driver-common = { path = "../driver-common" }
driver-geoparquet = { path = "../driver-geoparquet" }
driver-geojson = { path = "../driver-geojson" }
driver-csv = { path = "../driver-csv" }
driver-gpkg = { path = "../driver-gpkg" }
arrow-array.workspace = true
arrow-schema.workspace = true
geo-types.workspace = true
serde_json.workspace = true
tempfile.workspace = true
libc.workspace = true

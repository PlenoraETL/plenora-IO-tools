[package]
name = "plenora-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "plenora-bench"
path = "src/main.rs"

# Benchmark A/B del percorso convert con e senza spill (S2). Sta in un binario
# separato perche' misura una cosa diversa dall'harness principale: non la
# velocita' di un driver, ma il costo che lo spool bounded aggiunge quando si
# attiva davvero.
[[bin]]
name = "plenora-bench-spool-ab"
path = "src/bin/spool_ab.rs"

# Unica deroga al `forbid(unsafe_code)` di workspace: questo harness misura
# allocazioni e rusage e richiede un `GlobalAlloc` contatore e `getrusage`.
# Non e' codice di libreria, non entra nel perimetro spedito e resta escluso
# dal gate anti-panic CI, che gira su `--workspace --lib`. La tabella clippy
# del workspace resta applicata.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

[dependencies]
plenora-io-model = { path = "../plenora-io-model", features = ["metrics"] }
plenora-io-core = { path = "../plenora-io-core" }
driver-common = { path = "../driver-common" }
driver-geoparquet = { path = "../driver-geoparquet" }
driver-geojson = { path = "../driver-geojson" }
driver-csv = { path = "../driver-csv" }
driver-gpkg = { path = "../driver-gpkg" }
driver-kml = { path = "../driver-kml" }
driver-dxf = { path = "../driver-dxf" }
driver-shp = { path = "../driver-shp" }
driver-xls = { path = "../driver-xls" }
arrow-array.workspace = true
arrow-schema.workspace = true
geo-types.workspace = true
serde_json.workspace = true
libc.workspace = true

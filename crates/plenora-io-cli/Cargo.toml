[package]
name = "plenora-io-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# La libreria **e** il binario, e la separazione non e' di comodo: il profilo
# io-tools pretende una superficie Rust pubblica con una mappatura versionata,
# verificata da un consumatore che importa solo gli export documentati -- e un
# binario non si importa. Le operazioni stanno in `lib.rs`; `main.rs` e' il
# binding CLI, cioe' flussi, codici d'uscita e radici dell'artefatto.
#
# Il nome del pacchetto resta `plenora-io-cli` per ora: rinominarlo tocca
# cinquantatre file fra CI, gate e manifesti, ed e' un intervento suo. La riga
# C1b del piano lo registra.
[lib]
name = "plenora_io_cli"
path = "src/lib.rs"

[[bin]]
name = "plenora-io"
path = "src/main.rs"

[dependencies]
plenora-io-core = { path = "../plenora-io-core" }
plenora-io-model = { path = "../plenora-io-model" }
driver-geoparquet = { path = "../driver-geoparquet" }
driver-geojson = { path = "../driver-geojson" }
driver-csv = { path = "../driver-csv" }
driver-gpkg = { path = "../driver-gpkg" }
driver-shp = { path = "../driver-shp" }
driver-kml = { path = "../driver-kml" }
driver-xls = { path = "../driver-xls" }
driver-dxf = { path = "../driver-dxf" }
driver-filegdb = { path = "../driver-filegdb" }
driver-ipc = { path = "../driver-ipc" }
serde_json.workspace = true
ctrlc.workspace = true

[features]
# Abilita il tier GDB (FileGDB via GDAL) nel binario.
gdal-backend = ["driver-filegdb/gdal-backend"]

[dev-dependencies]
arrow-array.workspace = true
# Solo per `tests/foglio_vuoto.rs`, che costruisce a mano un XLSX senza
# `<dimension>`: l'elemento e' opzionale in ECMA-376, e una libreria che non sa
# ometterlo non puo' produrre il caso.
zip.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
# Solo per `tests/schemi_io_read.rs`: gli esempi di conformita' vanno validati
# con un validatore che non sia il nostro, altrimenti si proverebbe che il
# nostro validatore concorda con se stesso. E' gia' nel workspace -- la usa
# `driver-geoparquet` -- quindi il grafo compilato del prodotto non cambia.
jsonschema.workspace = true
tempfile.workspace = true

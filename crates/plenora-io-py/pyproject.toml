#
# Non si costruisce da qui: maturin vuole il sorgente Python dentro la
# directory del progetto, e il sorgente sta in `sdk/python/src`.
# `scripts/prepara-wheel-nativa.py` copia questo file e quel sorgente in
# `target/wheel-nativa/`, e maturin costruisce di li'. I percorsi qui sotto
# sono relativi a quella directory.
[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "plenora-io"
description = "SDK Python di plenora-io-tools: il protocollo v2, eseguito nel processo"
readme = "README.md"
# Python minimo dalla fonte .python-version, verificato in CI su Linux e Windows.
requires-python = ">=3.14,<3.15"
# La versione e' quella del crate, cioe' quella del workspace e del CLI.
dynamic = ["version"]
dependencies = []
license = { text = "Proprietary" }
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.optional-dependencies]
pyarrow = ["pyarrow>=25,<26"]

[project.urls]
Repository = "https://github.com/PlenoraETL/plenora-IO-tools"

[tool.maturin]
manifest-path = "../../crates/plenora-io-py/Cargo.toml"
python-source = "python"
module-name = "plenora_io._native"
include = ["LICENSE", "python/plenora_io/py.typed", "python/plenora_io/LICENSE", "python/plenora_io/LICENSES/**/*"]
